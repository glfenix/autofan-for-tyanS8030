# autofan — конфигурация (KEY=VALUE, файл можно source в bash)
# Путь: /etc/autofan/autofan.conf
# После правки: systemctl reload autofan (SIGHUP) — конфиг перечитывается без остановки.
# Любая переменная может быть переопреждена из окружения (systemd EnvironmentFile=).

# --------------------------------------------------------------- общее --------
STARTUP_DUTY=35               # скорость корпусных вентиляторов при запуске ОС/сервиса,
                              # ещё до первого решения по датчикам. 35% ~ 690-750 RPM.
ON_EXIT_DUTY=35               # то же значение при штатной остановке сервиса (SIGTERM)
POLL_INTERVAL=25              # секунд между циклами; SDR обновляется раз в 1-2 с,
                              # а корпус нагревается десятками секунд — чаще не нужно.
                              # для управления по сети (lanplus) лучше 30-40.
FAST_POLL_INTERVAL=5          # цикл, пока какой-то датчик выше CRITICAL_TEMP
CRITICAL_TEMP=80              # порог "жарко": сразу на максимум + ускоренный опрос
FAILSAFE_DUTY=85              # если ни один источник не ответил (авария BMC/датчиков)
STATE_FILE=/var/lib/autofan/state.json
VERBOSE=0                     # 1 = писать каждый цикл, даже без изменений

# --------------------------------------------------- проверка результата ------
VERIFY_RPM=1                  # после установки duty читать тахометры
VERIFY_DELAY_SECONDS=15       # тахометр приходит в соответствие за 7-10 с
RPM_PER_DUTY=17.2             # калибровка: RPM = RPM_OFFSET + RPM_PER_DUTY*duty
RPM_OFFSET=202                # наши 4 вентилятора: 35%->828, 45%->966, 55%->1104,
                              # 60%->1242, 75%->1518, 85%->1656 (линейная часть
                              # не проходит через ноль, отсюда смещение)
RPM_WARN_FACTOR=0.30          # отклонение больше 30% от ожидания = предупреждение

# ------------------------------------------------------------------- BMC ------
BMC_INTERFACE=open            # open = локально через /dev/ipmi0, без пароля и сети
BMC_DEVICE=/dev/ipmi0
BMC_PROFILE=tyan64            # прошивка 4.11/6.02: raw 0x2e 0x44 0xfd 0x19 0x00 <pwm> 0x01 <duty>
BMC_TIMEOUT=20
BMC_RETRIES=2
# управление по сети вместо двух строк выше:
#   BMC_INTERFACE=lanplus
#   BMC_HOST=192.168.1.10
#   BMC_USER=fancontrol
#   BMC_PASSWORD_FILE=/etc/autofan/bmc.pass     # chmod 600
#   BMC_CIPHER=17

# -------------------------------------------------- источники температур ------
# FLOOR = учитывать источник только выше этой температуры. Нужен потому, что
# датчики DIMM и MOSFET на этой плате тёплые сами по себе (52-55C в простое) и
# иначе не дали бы вентиляторам опуститься до стартовых 35%.

SRC1_NAME=gpu                          # RTX 5080 в ВМ 104
SRC1_TYPE=gpu
SRC1_VM=104                            # через qemu-guest-agent (qm guest exec)
SRC1_AGG=max                           # максимум из ядро/VRAM
SRC1_OPTIONAL=1                        # выключенная ВМ — не авария

SRC2_NAME=cpu_tctl                     # вот этот и есть "процессор до 50 градусов"
SRC2_TYPE=bmc
SRC2_SENSOR=CPU_Tctl_Value

SRC3_NAME=air_outlet
SRC3_TYPE=bmc
SRC3_SENSOR=SYS_Air_Outlet
SRC3_FLOOR=37                          # в простое 31-35C

SRC4_NAME=air_inlet
SRC4_TYPE=bmc
SRC4_SENSOR=MB_Air_Inlet
SRC4_FLOOR=42                          # температура комнаты

SRC5_NAME=cpu_mosfet
SRC5_TYPE=bmc
SRC5_SENSOR=CPU_MOSFET
SRC5_FLOOR=54                          # в простое 49-52C

SRC6_NAME=dimm_mosfet
SRC6_TYPE=bmc
SRC6_SENSORS=DIMM_MOSFET_1 DIMM_MOSFET_2
SRC6_AGG=max
SRC6_FLOOR=56                          # в простое ~52C

SRC7_NAME=soc_mosfet
SRC7_TYPE=bmc
SRC7_SENSOR=CPU_SOC_MOSFET
SRC7_FLOOR=50                          # в простое 43-48C

SRC8_NAME=dimm_channels
SRC8_TYPE=bmc
SRC8_AGG=max
SRC8_FLOOR=58                          # в простое 53-55C; 61-64C = нагрев от выхлопа GPU
SRC8_SENSORS=P0_UMC0_CH_A0 P0_UMC1_CH_B0 P0_UMC2_CH_D0 P0_UMC3_CH_C0 P0_UMC4_CH_H0 P0_UMC5_CH_G0 P0_UMC6_CH_E0 P0_UMC7_CH_F0

SRC9_NAME=nvme
SRC9_TYPE=bmc
SRC9_SENSORS=M.2/M.3_NVMe_0 M.2/M.3_NVMe_1
SRC9_AGG=max
SRC9_FLOOR=50

# --------------------------------------- группа 1: корпус, 8x120 мм -----------
# PWM2..5 = SYS_FAN_1..4 (проверено на этом BMC). CPU_FAN (PWM0/1) остаётся за
# BMC: на прошивке 6.02 нет программного возврата в автомат (0xff -> rsp=0xcc).
G1_NAME=chassis
G1_PWM=2,3,4,5
G1_TACH=SYS_FAN_1,SYS_FAN_2,SYS_FAN_3,SYS_FAN_4
G1_SOURCES=gpu cpu_tctl air_outlet air_inlet cpu_mosfet dimm_mosfet soc_mosfet dimm_channels nvme
G1_AGG=max
G1_STARTUP_DUTY=35
G1_MIN_DUTY=35                # ниже не опускаемся никогда, кроме ручных команд
G1_MAX_DUTY=100
G1_STEP=5                     # понижаем только если изменение >= 5%
G1_DWELL=120                  # и не чаще раза в 2 минуты
G1_FAILSAFE_DUTY=85
G1_CRITICAL_TEMP=80
# 45C=35%  50C=45%  60C=55%  70C=70%  78C=85%  85C=100%
# Ниже 45C держится стартовые 35%, при 50C (процессор прогретый) — 45%.
G1_CURVE=45:35 50:45 60:55 70:70 78:85 85:100
G1_CURVE_MODE=step

# УПРЕЖДЕНИЕ ПО МОЩНОСТИ GPU (Вт, не градусы).
# Сейчас выхлоп RTX 5080 идёт вверх, прямо на кулер процессора и на зону
# VRM/DIMM, то есть карта греет именно эти датчики. Температура ядра карты при
# этом почти не показывает ничего: её собственное охлаждение справляется, а в
# корпус уходит 200-300 Вт. Поэтому мощность карты сама по себе поднимает duty,
# не дожидаясь, пока датчики корпуса догреются.
#   80Вт=40%  150Вт=50%  220Вт=60%  300Вт=75%
# Работает как нижняя граница: итоговый duty = max(кривая по температурам,
# упреждение по ваттам). Вниз duty уходит по обычным правилам (ШАГ + ВЫДЕРЖКА),
# так что короткий всплеск инференса не будет гонять вентиляторы туда-сюда.
# Когда приедут райзеры PCIe и карта перестанет дуть в зону памяти/CPU, этот
# механизм можно оставить (он про тепловыделение) или обнулить строкой ниже.
G1_POWER_CURVE=80:40 150:50 220:60 300:75

# Замер на этом железе: 48 потоков AVX2-FMA на хосте => CPU_Tctl 53C,
# CPU_MOSFET 52C, выхлоп 31C, оборота CPU_FAN хватает. То есть 8x120 мм +
# башня дают большой запас, и точка нагрева здесь — зона GPU, а не процессор.

# --------------------------------------- группа 2 (образец, выключена) --------
# G2_NAME=cpu
# G2_PWM=0,1
# G2_TACH=CPU_FAN,CPU1_FAN
# G2_SOURCES=cpu_core
# G2_STARTUP_DUTY=45
# G2_CURVE=50:45 65:60 80:85 90:100
# SRC10_NAME=cpu_core
# SRC10_TYPE=bmc
# SRC10_SENSOR=CPU_Tctl_Value
